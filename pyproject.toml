[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "twod-bmp-linf-experiments"
version = "0.1.0"
description = "Exact incremental SAT experiments for the square-grid 2D-BMP under the Chebyshev norm"
requires-python = ">=3.10"
dependencies = [
  "python-sat>=1.9.dev15,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-cov>=5,<7",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["."]
testpaths = ["python/tests"]
